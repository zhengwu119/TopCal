name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify Swift toolchain
        run: swift --version

      - name: Build app
        run: ./build.sh build

      - name: Verify app bundle
        run: |
          echo "--- bundle contents ---"
          ls -la build/TopCal.app/Contents/MacOS/
          ls -d build/TopCal.app/Contents/Resources/*.lproj
          test -x build/TopCal.app/Contents/MacOS/TopCal && echo "binary: OK" || { echo "binary: MISSING"; exit 1; }
          test -d build/TopCal.app/Contents/Resources/en.lproj && echo "lproj: OK" || { echo "lproj: MISSING"; exit 1; }
          codesign --verify build/TopCal.app && echo "signature: OK" || { echo "signature: FAILED"; exit 1; }
          echo "Build and signature verification passed"
